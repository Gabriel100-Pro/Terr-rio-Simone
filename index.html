<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Simone Terrários</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="hero">

    <!-- Overlay escuro sobre a imagem -->
    <div class="hero-overlay"></div>

    <!-- HEADER -->
    <header class="header">

      <a href="#" class="brand">
        <span class="brand-name">SIMONE</span>
        <span class="brand-subtitle">TERRÁRIOS</span>
      </a>

      <nav class="navigation">

        <a href="#terrarios">TERRÁRIOS</a>
        <a href="#sobre">SOBRE</a>
        <a href="#cuidados">CUIDADOS</a>
        <a href="#contato">CONTATO</a>

      </nav>

      <div class="header-actions">

        <a href="#" aria-label="Instagram" class="icon-link">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="0.7" fill="currentColor"></circle>
          </svg>
        </a>

        <a href="#" aria-label="Carrinho" class="icon-link">
          <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M5 8h14l-1 12H6L5 8Z"></path>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
          </svg>
        </a>

      </div>

    </header>


    <!-- CONTEÚDO CENTRAL -->
    <section class="hero-content">

      <div class="brand-center">

        <h1>SIMONE</h1>

        <div class="brand-divider">

          <span></span>

          <p>TERRÁRIOS</p>

          <span></span>

        </div>

      </div>


      <!-- Detalhe botânico -->
      <div class="botanical-symbol">

        <span class="symbol-line"></span>

        <svg
          width="38"
          height="52"
          viewBox="0 0 38 52"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M19 48C19 32 20 18 32 6"
            stroke="currentColor"
            stroke-width="1.2"
          />

          <path
            d="M20 33C13 29 8 24 7 19"
            stroke="currentColor"
            stroke-width="1.2"
          />

          <path
            d="M20 27C27 24 31 19 32 14"
            stroke="currentColor"
            stroke-width="1.2"
          />

          <path
            d="M19 40C12 38 8 34 6 29"
            stroke="currentColor"
            stroke-width="1.2"
          />

        </svg>

        <span class="symbol-line"></span>

      </div>


      <!-- CTA -->
      <a href="#terrarios" class="hero-button">

        <span>CONHEÇA OS TERRÁRIOS</span>

        <span class="arrow">→</span>

      </a>

    </section>


    <!-- SCROLL -->
    <div class="scroll-indicator">

      <span>SCROLL</span>

      <div class="scroll-line"></div>

    </div>

  </main>

</body>
</html>
